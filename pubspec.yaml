name: ipanicx
description: "iPanicX - local iPhone panic diagnostics for macOS and Windows"
publish_to: 'none'
version: 0.1.5+8

environment:
  sdk: ^3.8.0

dependencies:
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/diagnostics/
    - assets/samples/
    - assets/branding/
